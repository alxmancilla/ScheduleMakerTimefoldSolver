name: CI

# Runs the same two commands the README documents for local development
# (`mvn test`, `npm test`) on every push and PR, so the test discipline both
# sides of this project have builds up actually gets enforced instead of
# being opt-in-only. Deliberately does NOT run `mvn -pl web verify` (the
# Testcontainers-backed integration layer) - that needs Docker and is a
# separate, heavier check, not part of what `mvn test` covers.
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  backend:
    name: Backend (Maven)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # common + engine + reporter + web, all Mockito-mocked unit tests - no
      # database needed. BlockSchedulingIntegrationTest's real-DB case is
      # gated behind -Dit.db.url (unset here), so it self-skips.
      - name: mvn test
        run: mvn test

  frontend:
    name: Frontend (Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web-ui/package-lock.json

      - run: npm ci
      - run: npm test

# Server Configuration
server.port=8080

# CORS Configuration
# Comma-separated list of origins allowed to call /api/**.
# Override with the CORS_ALLOWED_ORIGINS environment variable (e.g. https://app.example.com).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# Security / JWT Configuration
# HMAC (HS256) signing secret for issued JWTs. MUST be at least 32 bytes and MUST
# be overridden in production via the JWT_SECRET environment variable. The default
# below is for local development only.
app.jwt.secret=${JWT_SECRET:dev-only-insecure-jwt-secret-change-me-32bytes-minimum}
# Token lifetime in seconds (default 8 hours).
app.jwt.ttl-seconds=${JWT_TTL_SECONDS:28800}
# Initial admin bootstrap: when the app_user table is empty, an ADMIN user is
# created with this username/password. Set ADMIN_BOOTSTRAP_PASSWORD in the
# environment to enable it (no user is created if the password is blank).
app.admin.bootstrap-username=${ADMIN_BOOTSTRAP_USERNAME:admin}
app.admin.bootstrap-password=${ADMIN_BOOTSTRAP_PASSWORD:}

# Database Configuration
# Override with DB_URL / DB_USER / DB_PASSWORD environment variables
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/school_schedule}
spring.datasource.username=${DB_USER:mancilla}
spring.datasource.password=${DB_PASSWORD:}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.org.springframework.web=INFO
logging.level.com.example=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

